[package]
name = "app_services"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "App-level orchestration: document/file intake, settings persistence, session history, platform integration."

[features]
default = []
# Native file dialogs (pulls GUI toolkit deps on Linux); enabled by the app crate.
native-dialogs = ["dep:rfd"]

[dependencies]
domain = { workspace = true }
pdf_engine = { workspace = true }
packaging = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
rfd = { workspace = true, optional = true }

[dev-dependencies]
