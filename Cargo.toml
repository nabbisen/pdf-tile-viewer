[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/domain",
    "crates/pdf_engine",
    "crates/app_services",
    "crates/packaging",
]

[workspace.package]
version     = "2.0.0-beta.7"
edition     = "2024"

license                 = "Apache-2.0"
authors                 = ["nabbisen"]
repository              = "https://github.com/nabbisen/pdf-tile-viewer"

[workspace.dependencies]
domain                      = { version = "2.0.0-beta.7", path = "crates/domain" }
pdf_engine                  = { version = "2.0.0-beta.7", path = "crates/pdf_engine" }
app_services                = { version = "2.0.0-beta.7", path = "crates/app_services" }
packaging                   = { version = "2.0.0-beta.7", path = "crates/packaging" }

dioxus                      = { version = "0.7", features = ["document"] }

dirs                        = "6"
pdfium-render               = "0.9"
png                         = "0.18"
rfd                         = { version = "0.17", features = ["xdg-portal"] }

base64                      = "0.22"
futures-channel             = "0.3"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"

[profile.release]
lto     = "thin"
strip   = "symbols"
