name: Microsoft Store (MSIX)

# Build a Windows MSIX package for Microsoft Store submission.
#
# This is a SEPARATE release pathway from the cross-platform executable
# release (release.yml). It builds automatically after the Release workflow
# succeeds, can also build for a manually published GitHub Release, and can be
# started manually. Store submission remains a deliberate, human-reviewed act;
# this workflow builds the .msix artifact but does not publish it to Partner
# Center.
#
# Pathway summary:
#   release.yml  → tag-triggered → .tar.gz/.zip per OS → GitHub Release
#   this file    → release workflow/manual → .msix    → Partner Center (Windows)
#
# The .msix is produced as a workflow artifact. Uploading to Partner
# Center is left as a manual or separately-credentialed step, because Store
# publishing requires Partner Center secrets and human review of the listing.
#
# MSIX version: always "<Cargo core X.Y.Z>.0". The Store reserves the fourth
# segment, so there is no revision input; re-submitting the same code means a
# new patch version (RFC 036 § 5.7). The manifest in the repository carries the
# real version (written by ci/set-version.sh); ci/stage-msix.sh verifies it.

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

# Least privilege (RFC 036 § 5.3): no write scope; the signing secrets are
# referenced by the signing step only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PDFIUM_RELEASE_TAG: chromium/7920
  RUST_TARGET: x86_64-pc-windows-msvc
  PLATFORM_SEGMENT: windows-x86_64

jobs:
  msix:
    name: build MSIX
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      # Boolean only: whether a signing certificate secret exists. The secret
      # value is not exposed to this step (RFC 036 § 5.3).
      - name: Check whether a signing certificate is configured
        id: cert
        shell: bash
        env:
          HAS_CERT: ${{ secrets.MSIX_CERT_BASE64 != '' }}
        run: echo "has_cert=${HAS_CERT}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Fetch PDFium (win-x64)
        shell: bash
        run: |
          set -euo pipefail
          dest="resources/pdfium/${PLATFORM_SEGMENT}"
          mkdir -p "$dest"
          asset="pdfium-win-x64.tgz"
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE_TAG}/${asset}"
          curl -fSL --retry 3 -o /tmp/pdfium.tgz "$url"
          # Fail closed before anything is extracted (RFC 036 § 5.1).
          bash ci/verify-sha256.sh /tmp/pdfium.tgz "${PDFIUM_RELEASE_TAG}" "${asset}"
          mkdir -p /tmp/pdfium-extract
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium-extract
          if [ -f "/tmp/pdfium-extract/bin/pdfium.dll" ]; then
            cp "/tmp/pdfium-extract/bin/pdfium.dll" "$dest/"
          else
            cp "/tmp/pdfium-extract/lib/pdfium.dll" "$dest/"
          fi
          ls -l "$dest"

      - name: Build release binary
        shell: bash
        env:
          NO_STRIP: "1"
        run: cargo build --release -p app --target "${RUST_TARGET}"

      - name: Verify PDFium binding (smoke test)
        shell: bash
        env:
          PDF_TILE_VIEWER_PDFIUM_DIR: ${{ github.workspace }}/resources/pdfium/${{ env.PLATFORM_SEGMENT }}
        run: cargo test -p pdf_engine --test smoke --release --target "${RUST_TARGET}" -- --test-threads=1

      # Verifies that the manifest version is <Cargo core>.0 and writes
      # dist/msix-version.txt (single source for the package file name).
      - name: Stage MSIX package root
        shell: bash
        run: |
          bash ci/stage-msix.sh \
            "target/${RUST_TARGET}/release/pdf-tile-viewer.exe" \
            "resources/pdfium/${PLATFORM_SEGMENT}/pdfium.dll" \
            "dist/msix-root"

      - name: Bundle Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsRoot)) {
            throw "Visual C++ redistributable component not found in Visual Studio installation."
          }

          $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC"
          $crtDir = Get-ChildItem $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $crtDir) {
            throw "Microsoft.VC143.CRT x64 redistributable directory not found under $redistRoot"
          }

          $targets = @(
            "dist/msix-root",
            "dist/msix-root/resources/pdfium/windows-x86_64"
          )
          foreach ($target in $targets) {
            Copy-Item (Join-Path $crtDir "*.dll") -Destination $target -Force
          }

          Write-Host "Bundled Visual C++ runtime DLLs from $crtDir"
          Get-ChildItem $crtDir -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Verify staged MSIX manifest and runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '@[A-Za-z_]+@|Microsoft\.VCLibs|PackageDependency' dist/msix-root/AppxManifest.xml; then
            echo "Unexpected MSIX manifest placeholder or framework dependency found." >&2
            exit 1
          fi
          test -f dist/msix-root/vcruntime140.dll
          test -f dist/msix-root/vcruntime140_1.dll
          test -f dist/msix-root/msvcp140.dll
          test -f dist/msix-root/resources/pdfium/windows-x86_64/vcruntime140.dll
          test -f dist/msix-root/resources/pdfium/windows-x86_64/vcruntime140_1.dll
          test -f dist/msix-root/resources/pdfium/windows-x86_64/msvcp140.dll

      - name: Locate Windows SDK tools (makeappx, signtool)
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem -Path $sdkRoot -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in Windows SDK" }
          $binDir = Split-Path $makeappx.FullName
          echo "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          echo "Found SDK tools in: $binDir"

      - name: Build MSIX package
        shell: pwsh
        env:
          SDK_BIN: ${{ steps.sdk.outputs.bin_dir }}
        run: |
          $ver = (Get-Content "dist/msix-version.txt" -Raw).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "Unexpected MSIX version '$ver' (expected X.Y.Z.0)"
          }
          $out = "dist/pdf-tile-viewer-$ver.msix"
          & "$env:SDK_BIN\makeappx.exe" pack `
            /d "dist/msix-root" `
            /p $out `
            /overwrite
          echo "MSIX_PATH=$out" >> $env:GITHUB_ENV
          Get-ChildItem $out

      # ── Optional code signing ─────────────────────────────────────────────
      # Provide these repository secrets to enable signing:
      #   MSIX_CERT_BASE64    — base64 of a .pfx code-signing certificate
      #   MSIX_CERT_PASSWORD  — its password
      # Without them the MSIX is produced UNSIGNED (Partner Center re-signs
      # Store submissions with the Store certificate, so an unsigned package
      # is acceptable for Store upload; sideloading would require signing).
      # This is the only step that receives the secrets.
      - name: Sign MSIX (if certificate provided)
        if: ${{ steps.cert.outputs.has_cert == 'true' }}
        shell: pwsh
        env:
          MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
          SDK_BIN: ${{ steps.sdk.outputs.bin_dir }}
        run: |
          $pfx = "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
          & "$env:SDK_BIN\signtool.exe" sign `
            /fd SHA256 `
            /a /f $pfx `
            /p $env:MSIX_CERT_PASSWORD `
            "$env:MSIX_PATH"
          Remove-Item $pfx

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-tile-viewer-msix
          path: ${{ env.MSIX_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Submission reminder
        shell: bash
        run: |
          echo "::notice::MSIX built. Upload dist/*.msix to Microsoft Partner"
          echo "::notice::Center manually, or wire a Store-submission action with"
          echo "::notice::Partner Center credentials. Store publish is a"
          echo "::notice::deliberate, human-reviewed step and is NOT automated here."
