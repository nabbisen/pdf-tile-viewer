name: Release

# Triggered by a semver version tag (e.g. 2.0.0-beta.8; no "v" prefix,
# per project convention). Builds the RFC 014
# artifact matrix — Linux x64, Windows x64, macOS arm64, macOS x64 — each
# with its bundled PDFium dynamic library, then publishes a GitHub Release.
#
# IMPORTANT: pushing a tag is the explicit, human-initiated act that starts
# a release. This workflow does not run on branch pushes. A pre-release tag
# (containing '-alpha', '-beta', or '-rc') is marked as a GitHub pre-release.

on:
  push:
    tags:
      # Semver tags WITHOUT a leading "v" (project convention), e.g.
      # 2.0.0, 2.0.0-beta.8, 2.1.0-beta.1.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # required to create a Release and upload assets

env:
  CARGO_TERM_COLOR: always
  PDFIUM_RELEASE_TAG: chromium/7920

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            pdfium_target: linux-x64
            platform_segment: linux-x86_64
            lib_file: libpdfium.so
            bin_file: pdf-tile-viewer
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            pdfium_target: win-x64
            platform_segment: windows-x86_64
            lib_file: pdfium.dll
            bin_file: pdf-tile-viewer.exe
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            pdfium_target: mac-arm64
            platform_segment: macos-aarch64
            lib_file: libpdfium.dylib
            bin_file: pdf-tile-viewer
          - name: macos-x64
            os: macos-13
            rust_target: x86_64-apple-darwin
            pdfium_target: mac-x64
            platform_segment: macos-x86_64
            lib_file: libpdfium.dylib
            bin_file: pdf-tile-viewer

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev pkg-config

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          v=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/".*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "App version: $v"

      # ── Fetch the platform PDFium and place it where the build expects ──────
      - name: Fetch PDFium (${{ matrix.pdfium_target }})
        shell: bash
        run: |
          set -euo pipefail
          dest="resources/pdfium/${{ matrix.platform_segment }}"
          mkdir -p "$dest"
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE_TAG}/pdfium-${{ matrix.pdfium_target }}.tgz"
          echo "Fetching $url"
          curl -fSL --retry 3 -o /tmp/pdfium.tgz "$url"
          mkdir -p /tmp/pdfium-extract
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium-extract
          # bblanchon archives place the library under lib/ (unix) or bin/ (windows)
          if [ -f "/tmp/pdfium-extract/lib/${{ matrix.lib_file }}" ]; then
            cp "/tmp/pdfium-extract/lib/${{ matrix.lib_file }}" "$dest/"
          else
            cp "/tmp/pdfium-extract/bin/${{ matrix.lib_file }}" "$dest/"
          fi
          ls -l "$dest"

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build release binary
        shell: bash
        env:
          NO_STRIP: "1"
        run: cargo build --release -p app --target ${{ matrix.rust_target }}

      # ── Engine smoke test against the fetched PDFium (RFC 014 §7) ───────────
      - name: Verify PDFium binding (smoke test)
        shell: bash
        env:
          PDF_TILE_VIEWER_PDFIUM_DIR: ${{ github.workspace }}/resources/pdfium/${{ matrix.platform_segment }}
        run: cargo test -p pdf_engine --test smoke --release --target ${{ matrix.rust_target }} -- --test-threads=1

      # ── Stage the artifact (RFC 014 §6 required contents) ──────────────────
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          name="pdf-tile-viewer-v${{ steps.version.outputs.version }}-${{ matrix.name }}"
          stage="dist/$name"
          mkdir -p "$stage/bin" "$stage/resources/pdfium/${{ matrix.platform_segment }}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.bin_file }}" "$stage/bin/"
          cp "resources/pdfium/${{ matrix.platform_segment }}/${{ matrix.lib_file }}" \
             "$stage/resources/pdfium/${{ matrix.platform_segment }}/"
          cp LICENSE NOTICE CHANGELOG.md README.md "$stage/"
          cat > "$stage/notes.txt" <<EOF
          PDF Tile Viewer v${{ steps.version.outputs.version }} — ${{ matrix.name }}

          Unsigned build. PDFium ${PDFIUM_RELEASE_TAG} bundled in resources/.

          Launch from the extracted directory:
            ./bin/${{ matrix.bin_file }}

          Keep the bundled resources/ directory at the top level of the extracted archive.
          Do not move the executable out of the extracted folder.
          Report issues: https://github.com/nabbisen/pdf-tile-viewer/issues
          EOF
          echo "stage_dir=$stage" >> "$GITHUB_ENV"
          echo "artifact_name=$name" >> "$GITHUB_ENV"

      # ── Compress: .zip on Windows, .tar.gz elsewhere ───────────────────────
      - name: Compress artifact (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist && tar -czf "${artifact_name}.tar.gz" "${artifact_name}" )
          ls -lh "dist/${artifact_name}.tar.gz"

      - name: Compress artifact (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:artifact_name" -DestinationPath "dist/$env:artifact_name.zip"
          Get-ChildItem "dist/$env:artifact_name.zip"

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name }}
          path: |
            dist/${{ env.artifact_name }}.tar.gz
            dist/${{ env.artifact_name }}.zip
          if-no-files-found: ignore
          retention-days: 7

  # ── Source archive (matches ci/archive-source.sh layout) ─────────────────
  source:
    name: source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build source archive
        run: bash ci/archive-source.sh dist
      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: dist/*.tar.gz
          retention-days: 7

  # ── Publish the GitHub Release with all collected artifacts ──────────────
  release:
    name: publish release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-files/ \;
          ls -lh release-files

      - name: Determine pre-release status
        id: prerelease
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *-alpha* || "$tag" == *-beta* || "$tag" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
